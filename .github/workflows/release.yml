name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dv-annotate-dist
          path: dist

      - name: Check tag matches script version
        run: |
          # Tolerate the UTF-8 BOM and CRLF line endings.
          version=$(sed -n '1s/^\xEF\xBB\xBF//; 1s/\r$//; 1s/^\$Version = "\([0-9][0-9.]*\)".*/\1/p' windows/dv-annotate.ps1)
          tag_version="${TAG#v}"
          if [ -z "$version" ] || [ "$tag_version" != "$version" ]; then
            echo "::error::Tag '$TAG' (version '$tag_version') does not match \$Version '$version' in windows/dv-annotate.ps1"
            exit 1
          fi
          if [ ! -f "dist/dv-annotate-setup-$version.exe" ] || [ ! -f dist/dv-annotate.ps1 ]; then
            echo "::error::Expected dist/dv-annotate-setup-$version.exe and dist/dv-annotate.ps1"
            ls -la dist
            exit 1
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/dv-annotate-setup-*.exe
            dist/dv-annotate.ps1

      - name: Create draft release, upload assets, publish
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --generate-notes --verify-tag \
            dist/dv-annotate-setup-*.exe dist/dv-annotate.ps1
          # Publish last so the release is complete before it becomes immutable.
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
