name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rebuild bundle and check it is committed
        run: |
          windows/Build-Bundle.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git diff --exit-code windows/build/dv-annotate.ps1
          if ($LASTEXITCODE) { Write-Error 'windows/build/dv-annotate.ps1 is stale; run windows/Build-Bundle.ps1 and commit it.'; exit 1 }

      - name: PSScriptAnalyzer
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          }
          Invoke-ScriptAnalyzer windows -Recurse -Settings windows/PSScriptAnalyzerSettings.psd1 -Severity Error -EnableExit

      - name: Install Inno Setup
        # Pinned: the runner image's preinstalled Inno Setup version has changed over time.
        run: |
          choco install innosetup --version 6.7.1 -y --no-progress --allow-downgrade
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Build installer
        run: |
          $out = & windows/installer/Build-Installer.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $setup = @($out | ForEach-Object { "$_".Trim() } | Where-Object { $_ -like '*.exe' -and (Test-Path -LiteralPath $_) })[-1]
          if (-not $setup) { Write-Error 'Build-Installer.ps1 did not report a setup exe path.'; exit 1 }
          "SETUP_PATH=$setup" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Test installer
        run: |
          windows/installer/Test-Installer.ps1 -Setup $env:SETUP_PATH
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dv-annotate-dist
          path: |
            windows/installer/Output/dv-annotate-setup-*.exe
            windows/build/dv-annotate.ps1
          if-no-files-found: error
